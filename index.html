<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karate Sensei - Entrenamiento y Torneo</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #d32f2f;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Pestañas de navegación */
    .tabs {
      display: flex;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: white;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .tab-content.active {
      display: flex;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    .display-area {
      text-align: center;
      padding: 30px 10px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: rgba(0,0,0,0.2);
    }

    .number-display {
      font-size: 4rem;
      font-weight: bold;
      color: var(--accent-color);
      line-height: 1;
    }

    .technique-display {
      font-size: 1.5rem;
      margin-top: 10px;
      font-weight: 500;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      text-transform: uppercase;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-primary:active {
      background-color: #b71c1c;
    }

    .btn-secondary {
      background-color: #333;
      color: white;
      margin-top: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: white;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .tech-item, .match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .tech-item-actions, .match-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .btn-edit { background-color: #0288d1; color: white; }
    .btn-delete { background-color: #d32f2f; color: white; }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row input:first-child {
      flex: 1;
    }

    .form-row input:last-child {
      flex: 2;
    }

    .match-card {
      background-color: #252525;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-names {
      font-weight: bold;
      font-size: 1rem;
    }

    .match-names span {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Karate Dojo</h1>
    </header>

    <!-- Pestañas -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('train')">Entrenamiento</button>
      <button class="tab-btn" onclick="switchTab('tournament')">Torneo / Llaves</button>
    </div>

    <!-- PESTAÑA 1: ENTRENAMIENTO -->
    <div id="trainTab" class="tab-content active">
      <div class="card">
        <div class="display-area">
          <div class="number-display" id="numDisplay">-</div>
          <div class="technique-display" id="techDisplay">Presiona Iniciar</div>
          <div class="status-text" id="statusText">Listo</div>
        </div>

        <button id="mainBtn" class="btn btn-primary">Iniciar Entrenamiento</button>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Configuración</h2>
        
        <div class="control-group">
          <label for="intervalMin">Intervalo Mínimo (seg):</label>
          <input type="number" id="intervalMin" value="2" min="1" max="10">
        </div>

        <div class="control-group">
          <label for="intervalMax">Intervalo Máximo (seg):</label>
          <input type="number" id="intervalMax" value="5" min="2" max="15">
        </div>

        <div class="control-group">
          <label for="voiceMode">Modo de Voz:</label>
          <select id="voiceMode">
            <option value="both">Número + Técnica</option>
            <option value="number">Solo Número</option>
            <option value="technique">Solo Técnica</option>
            <option value="silent">Silencioso</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Mapeo de Técnicas</h2>
        
        <div class="form-row" style="margin-bottom: 10px;">
          <input type="number" id="inputNum" placeholder="N°">
          <input type="text" id="inputTech" placeholder="Nombre de Técnica">
        </div>
        <button id="saveTechBtn" class="btn btn-secondary" style="margin-top: 0;">Guardar Técnica</button>

        <div id="techList" style="margin-top: 15px;"></div>
      </div>
    </div>

    <!-- PESTAÑA 2: TORNEO -->
    <div id="tournamentTab" class="tab-content">
      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Organizador de Torneo</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">
          Ingresa los nombres de los competidores (uno por línea o separados por comas).
        </p>

        <div class="control-group">
          <textarea id="competitorsInput" placeholder="Ej:
Juan Pérez
Carlos Gómez
María Ruiz
Ana Torres"></textarea>
        </div>

        <button id="generateMatchesBtn" class="btn btn-primary">Generar Encuentros Aleatorios</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="font-size: 1.2rem;">Llaves de Encuentros</h2>
          <button class="btn-sm btn-delete" onclick="clearMatches()" style="padding: 6px 12px;">Limpiar Todo</button>
        </div>

        <div id="matchesList">
          <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">No hay encuentros generados aún.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* --- CONTROL DE PESTAÑAS --- */
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'train') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('trainTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tournamentTab').classList.add('active');
      }
    }

    /* --- LÓGICA DE ENTRENAMIENTO --- */
    let techniques = JSON.parse(localStorage.getItem('karate_techs')) || {
      1: "Oi Tsuki",
      2: "Gyaku Tsuki",
      3: "Age Uke",
      4: "Soto Uke",
      5: "Gedan Barai"
    };

    let isRunning = false;
    let timer = null;

    const mainBtn = document.getElementById('mainBtn');
    const numDisplay = document.getElementById('numDisplay');
    const techDisplay = document.getElementById('techDisplay');
    const statusText = document.getElementById('statusText');
    const saveTechBtn = document.getElementById('saveTechBtn');
    const techList = document.getElementById('techList');

    function saveToStorage() {
      localStorage.setItem('karate_techs', JSON.stringify(techniques));
      renderList();
    }

    function renderList() {
      techList.innerHTML = '';
      Object.keys(techniques).sort((a,b) => a-b).forEach(num => {
        const item = document.createElement('div');
        item.className = 'tech-item';
        item.innerHTML = `
          <span><strong>${num}:</strong> ${techniques[num]}</span>
          <div class="tech-item-actions">
            <button class="btn-sm btn-edit" onclick="editTech(${num})">Editar</button>
            <button class="btn-sm btn-delete" onclick="deleteTech(${num})">X</button>
          </div>
        `;
        techList.appendChild(item);
      });
    }

    saveTechBtn.addEventListener('click', () => {
      const num = document.getElementById('inputNum').value;
      const tech = document.getElementById('inputTech').value.trim();

      if (num && tech) {
        techniques[num] = tech;
        saveToStorage();
        document.getElementById('inputNum').value = '';
        document.getElementById('inputTech').value = '';
      }
    });

    window.deleteTech = function(num) {
      delete techniques[num];
      saveToStorage();
    };

    window.editTech = function(num) {
      document.getElementById('inputNum').value = num;
      document.getElementById('inputTech').value = techniques[num];
    };

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerNext() {
      const keys = Object.keys(techniques);
      if (keys.length === 0) return;

      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const techName = techniques[randomKey];

      numDisplay.textContent = randomKey;
      techDisplay.textContent = techName;

      const mode = document.getElementById('voiceMode').value;
      if (mode === 'both') speak(`${randomKey}, ${techName}`);
      else if (mode === 'number') speak(randomKey);
      else if (mode === 'technique') speak(techName);

      scheduleNext();
    }

    function scheduleNext() {
      if (!isRunning) return;
      const min = parseInt(document.getElementById('intervalMin').value) || 2;
      const max = parseInt(document.getElementById('intervalMax').value) || 5;
      const delay = (Math.floor(Math.random() * (max - min + 1)) + min) * 1000;

      timer = setTimeout(triggerNext, delay);
    }

    mainBtn.addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        clearTimeout(timer);
        mainBtn.textContent = 'Iniciar Entrenamiento';
        mainBtn.style.backgroundColor = 'var(--accent-color)';
        statusText.textContent = 'Pausado';
      } else {
        isRunning = true;
        mainBtn.textContent = 'Detener';
        mainBtn.style.backgroundColor = '#555';
        statusText.textContent = 'Entrenando...';
        triggerNext();
      }
    });

    renderList();

    /* --- LÓGICA DE TORNEO / LLAVES --- */
    let matches = JSON.parse(localStorage.getItem('karate_matches')) || [];

    const competitorsInput = document.getElementById('competitorsInput');
    const generateMatchesBtn = document.getElementById('generateMatchesBtn');
    const matchesList = document.getElementById('matchesList');

    function saveMatchesStorage() {
      localStorage.setItem('karate_matches', JSON.stringify(matches));
      renderMatches();
    }

    function renderMatches() {
      if (matches.length === 0) {
        matchesList.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">No hay encuentros generados aún.</p>`;
        return;
      }

      matchesList.innerHTML = '';
      matches.forEach((match, index) => {
        const item = document.createElement('div');
        item.className = 'match-card';
        item.innerHTML = `
          <div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px;">Encuentro #${index + 1}</div>
            <div class="match-names">${match.p1} <span>vs</span> ${match.p2}</div>
          </div>
          <div class="match-actions">
            <button class="btn-sm btn-edit" onclick="editMatch(${index})">Editar</button>
            <button class="btn-sm btn-delete" onclick="deleteMatch(${index})">X</button>
          </div>
        `;
        matchesList.appendChild(item);
      });
    }

    generateMatchesBtn.addEventListener('click', () => {
      const rawText = competitorsInput.value.trim();
      if (!rawText) {
        alert("Por favor ingresa los nombres de los competidores.");
        return;
      }

      // Separar por saltos de línea o comas
      let list = rawText.split(/[\n,]+/).map(name => name.trim()).filter(name => name.length > 0);

      if (list.length < 2) {
        alert("Necesitas al menos 2 competidores para armar un encuentro.");
        return;
      }

      // Mezclar aleatoriamente (Algoritmo Fisher-Yates)
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }

      matches = [];
      for (let i = 0; i < list.length; i += 2) {
        if (i + 1 < list.length) {
          matches.push({ p1: list[i], p2: list[i+1] });
        } else {
          // Si sobra uno por número impar
          matches.push({ p1: list[i], p2: "Pasa directo / Bye" });
        }
      }

      saveMatchesStorage();
    });

    window.deleteMatch = function(index) {
      matches.splice(index, 1);
      saveMatchesStorage();
    };

    window.editMatch = function(index) {
      const currentP1 = matches[index].p1;
      const currentP2 = matches[index].p2;

      const newP1 = prompt("Editar competidor 1:", currentP1);
      if (newP1 === null) return;
      const newP2 = prompt("Editar competidor 2:", currentP2);
      if (newP2 === null) return;

      matches[index] = { p1: newP1.trim() || currentP1, p2: newP2.trim() || currentP2 };
      saveMatchesStorage();
    };

    window.clearMatches = function() {
      if (confirm("¿Estás seguro de borrar todos los encuentros?")) {
        matches = [];
        saveMatchesStorage();
      }
    }

    renderMatches();
  </script>
</body>
</html>
