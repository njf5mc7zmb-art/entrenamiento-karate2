<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karate Dojo - Entrenamiento y Torneo de Equipos</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #d32f2f;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tabs {
      display: flex;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: white;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .tab-content.active {
      display: flex;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    .display-area {
      text-align: center;
      padding: 30px 10px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: rgba(0,0,0,0.2);
    }

    .number-display {
      font-size: 4rem;
      font-weight: bold;
      color: var(--accent-color);
      line-height: 1;
    }

    .technique-display {
      font-size: 1.5rem;
      margin-top: 10px;
      font-weight: 500;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      text-transform: uppercase;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-secondary {
      background-color: #333;
      color: white;
      margin-top: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: white;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .tech-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .tech-item-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .btn-edit { background-color: #0288d1; color: white; }
    .btn-delete { background-color: #d32f2f; color: white; }
    .btn-win { background-color: #2e7d32; color: white; font-weight: bold; }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row input:first-child { flex: 1; }
    .form-row input:last-child { flex: 2; }

    /* Estilos del Torneo */
    .teams-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .team-checkbox-card {
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .team-checkbox-card input {
      width: auto;
    }

    .match-card {
      background-color: #252525;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    .competitor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background-color: #1e1e1e;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    .competitor-row.winner {
      border-color: #2e7d32;
      background-color: rgba(46, 125, 50, 0.15);
    }

    .competitor-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
    }

    .team-icon {
      width: 24px;
      height: 24px;
      stroke: var(--text-color);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .round-title {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin: 15px 0 10px 0;
      text-transform: uppercase;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Karate Dojo</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('train')">Entrenamiento</button>
      <button class="tab-btn" onclick="switchTab('tournament')">Torneo / Equipos</button>
    </div>

    <!-- PESTAÑA ENTRENAMIENTO -->
    <div id="trainTab" class="tab-content active">
      <div class="card">
        <div class="display-area">
          <div class="number-display" id="numDisplay">-</div>
          <div class="technique-display" id="techDisplay">Presiona Iniciar</div>
          <div class="status-text" id="statusText">Listo</div>
        </div>
        <button id="mainBtn" class="btn btn-primary">Iniciar Entrenamiento</button>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Configuración</h2>
        <div class="control-group">
          <label for="intervalMin">Intervalo Mínimo (seg):</label>
          <input type="number" id="intervalMin" value="2" min="1" max="10">
        </div>
        <div class="control-group">
          <label for="intervalMax">Intervalo Máximo (seg):</label>
          <input type="number" id="intervalMax" value="5" min="2" max="15">
        </div>
        <div class="control-group">
          <label for="voiceMode">Modo de Voz:</label>
          <select id="voiceMode">
            <option value="both">Número + Técnica</option>
            <option value="number">Solo Número</option>
            <option value="technique">Solo Técnica</option>
            <option value="silent">Silencioso</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Mapeo de Técnicas</h2>
        <div class="form-row" style="margin-bottom: 10px;">
          <input type="number" id="inputNum" placeholder="N°">
          <input type="text" id="inputTech" placeholder="Nombre de Técnica">
        </div>
        <button id="saveTechBtn" class="btn btn-secondary" style="margin-top: 0;">Guardar Técnica</button>
        <div id="techList" style="margin-top: 15px;"></div>
      </div>
    </div>

    <!-- PESTAÑA TORNEO CON EQUIPOS -->
    <div id="tournamentTab" class="tab-content">
      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Equipos Activos</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">Selecciona qué equipos pueden asignarse:</p>
        
        <div class="teams-select-grid">
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkLobo" checked>
            <span>Lobo 🐺</span>
          </label>
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkCalamar" checked>
            <span>Calamar 🦑</span>
          </label>
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkLeon" checked>
            <span>León 🦁</span>
          </label>
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkAguila" checked>
            <span>Águila 🦅</span>
          </label>
        </div>

        <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Competidores</h2>
        <div class="control-group">
          <textarea id="competitorsInput" placeholder="Ingresa nombres (uno por línea o separados por comas):
Juan Perez
Carlos Gomez
Maria Ruiz
Ana Torres"></textarea>
        </div>

        <button id="generateMatchesBtn" class="btn btn-primary">Generar Llaves de Torneo</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h2 style="font-size: 1.2rem;">Encuentros y Eliminatorias</h2>
          <button class="btn-sm btn-delete" onclick="clearTournament()" style="padding: 6px 12px;">Reiniciar</button>
        </div>

        <div id="tournamentBracket">
          <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">No hay torneo activo en este momento.</p>
        </div>

        <button id="nextRoundBtn" class="btn btn-secondary" style="display: none; margin-top: 15px;">Avanzar a la Siguiente Ronda ➔</button>
      </div>
    </div>

  </div>

  <script>
    /* SIMBOLOS SVG CON TRAZOS DE LINEAS ESTILO LOBO DEL DIBUJO */
    const TEAM_ICONS = {
      lobo: `<svg class="team-icon" viewBox="0 0 24 24"><path d="M4 18s2-4 4-6c1-1 3-2 5-1 2 1 3 3 5 3M6 12l-2-6 5 2 3-3 3 3 5-2-2 6M10 14h4"/></svg>`,
      calamar: `<svg class="team-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 6 6 6 10c0 4 3 6 3 9s1 3 3 3 3 0 3-3 3-5 3-9c0-4-2-8-6-8zM9 19v3M12 19v3M15 19v3"/></svg>`,
      leon: `<svg class="team-icon" viewBox="0 0 24 24"><path d="M12 3c-4 0-7 3-7 7 0 5 3 8 7 8s7-3 7-8c0-4-3-7-7-7zM5 8l-2-2M19 8l2-2M4 13l-2 1M20 13l2 1"/></svg>`,
      aguila: `<svg class="team-icon" viewBox="0 0 24 24"><path d="M3 10l6-4 3 4 3-4 6 4-3 6H6L3 10zM12 14v6M9 17h6"/></svg>`
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'train') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('trainTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tournamentTab').classList.add('active');
      }
    }

    /* ENTRENAMIENTO */
    let techniques = JSON.parse(localStorage.getItem('karate_techs')) || {
      1: "Oi Tsuki",
      2: "Gyaku Tsuki",
      3: "Age Uke",
      4: "Soto Uke",
      5: "Gedan Barai"
    };

    let isRunning = false;
    let timer = null;

    const mainBtn = document.getElementById('mainBtn');
    const numDisplay = document.getElementById('numDisplay');
    const techDisplay = document.getElementById('techDisplay');
    const statusText = document.getElementById('statusText');
    const saveTechBtn = document.getElementById('saveTechBtn');
    const techList = document.getElementById('techList');

    function saveToStorage() {
      localStorage.setItem('karate_techs', JSON.stringify(techniques));
      renderList();
    }

    function renderList() {
      techList.innerHTML = '';
      Object.keys(techniques).sort((a,b) => a-b).forEach(num => {
        const item = document.createElement('div');
        item.className = 'tech-item';
        item.innerHTML = `
          <span><strong>${num}:</strong> ${techniques[num]}</span>
          <div class="tech-item-actions">
            <button class="btn-sm btn-edit" onclick="editTech(${num})">Editar</button>
            <button class="btn-sm btn-delete" onclick="deleteTech(${num})">X</button>
          </div>
        `;
        techList.appendChild(item);
      });
    }

    saveTechBtn.addEventListener('click', () => {
      const num = document.getElementById('inputNum').value;
      const tech = document.getElementById('inputTech').value.trim();

      if (num && tech) {
        techniques[num] = tech;
        saveToStorage();
        document.getElementById('inputNum').value = '';
        document.getElementById('inputTech').value = '';
      }
    });

    window.deleteTech = function(num) {
      delete techniques[num];
      saveToStorage();
    };

    window.editTech = function(num) {
      document.getElementById('inputNum').value = num;
      document.getElementById('inputTech').value = techniques[num];
    };

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerNext() {
      const keys = Object.keys(techniques);
      if (keys.length === 0) return;

      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const techName = techniques[randomKey];

      numDisplay.textContent = randomKey;
      techDisplay.textContent = techName;

      const mode = document.getElementById('voiceMode').value;
      if (mode === 'both') speak(`${randomKey}, ${techName}`);
      else if (mode === 'number') speak(randomKey);
      else if (mode === 'technique') speak(techName);

      scheduleNext();
    }

    function scheduleNext() {
      if (!isRunning) return;
      const min = parseInt(document.getElementById('intervalMin').value) || 2;
      const max = parseInt(document.getElementById('intervalMax').value) || 5;
      const delay = (Math.floor(Math.random() * (max - min + 1)) + min) * 1000;

      timer = setTimeout(triggerNext, delay);
    }

    mainBtn.addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        clearTimeout(timer);
        mainBtn.textContent = 'Iniciar Entrenamiento';
        mainBtn.style.backgroundColor = 'var(--accent-color)';
        statusText.textContent = 'Pausado';
      } else {
        isRunning = true;
        mainBtn.textContent = 'Detener';
        mainBtn.style.backgroundColor = '#555';
        statusText.textContent = 'Entrenando...';
        triggerNext();
      }
    });

    renderList();

    /* TORNEO Y LLAVES INTERACTIVAS */
    let tournamentData = JSON.parse(localStorage.getItem('karate_tournament_v2')) || { currentRound: 1, rounds: {} };

    const generateMatchesBtn = document.getElementById('generateMatchesBtn');
    const tournamentBracket = document.getElementById('tournamentBracket');
    const nextRoundBtn = document.getElementById('nextRoundBtn');

    function saveTournament() {
      localStorage.setItem('karate_tournament_v2', JSON.stringify(tournamentData));
      renderTournament();
    }

    function getSelectedTeams() {
      const teams = [];
      if (document.getElementById('chkLobo').checked) teams.push('lobo');
      if (document.getElementById('chkCalamar').checked) teams.push('calamar');
      if (document.getElementById('chkLeon').checked) teams.push('leon');
      if (document.getElementById('chkAguila').checked) teams.push('aguila');
      return teams.length > 0 ? teams : ['lobo'];
    }

    generateMatchesBtn.addEventListener('click', () => {
      const rawText = document.getElementById('competitorsInput').value.trim();
      if (!rawText) return alert("Ingresa al menos 2 competidores.");

      let competitors = rawText.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
      if (competitors.length < 2) return alert("Ingresa al menos 2 competidores.");

      const activeTeams = getSelectedTeams();

      // Mezclar competidores
      for (let i = competitors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [competitors[i], competitors[j]] = [competitors[j], competitors[i]];
      }

      // Crear objetos competidor con equipo
      const participants = competitors.map(name => ({
        name: name,
        team: activeTeams[Math.floor(Math.random() * activeTeams.length)]
      }));

      // Generar primera ronda
      const matches = [];
      for (let i = 0; i < participants.length; i += 2) {
        if (i + 1 < participants.length) {
          matches.push({ p1: participants[i], p2: participants[i+1], winner: null });
        } else {
          matches.push({ p1: participants[i], p2: { name: "Pasa Directo (Bye)", team: participants[i].team }, winner: 1 });
        }
      }

      tournamentData = {
        currentRound: 1,
        rounds: { 1: matches }
      };

      saveTournament();
    });

    function setWinner(roundNum, matchIdx, winnerNum) {
      tournamentData.rounds[roundNum][matchIdx].winner = winnerNum;
      saveTournament();
    }

    function renderTournament() {
      if (!tournamentData.rounds || !tournamentData.rounds[1]) {
        tournamentBracket.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">No hay torneo activo en este momento.</p>`;
        nextRoundBtn.style.display = 'none';
        return;
      }

      tournamentBracket.innerHTML = '';
      let canAdvance = true;

      Object.keys(tournamentData.rounds).forEach(rNum => {
        const roundTitle = document.createElement('div');
        roundTitle.className = 'round-title';
        roundTitle.textContent = `Ronda ${rNum}`;
        tournamentBracket.appendChild(roundTitle);

        const matches = tournamentData.rounds[rNum];
        matches.forEach((m, idx) => {
          const matchCard = document.createElement('div');
          matchCard.className = 'match-card';
          
          matchCard.innerHTML = `
            <div class="match-header">
              <span>Encuentro #${idx + 1}</span>
              <span>${m.winner ? 'Completado' : 'Pendiente'}</span>
            </div>
            
            <!-- Competidor 1 -->
            <div class="competitor-row ${m.winner === 1 ? 'winner' : ''}">
              <div class="competitor-info">
                ${TEAM_ICONS[m.p1.team] || ''}
                <strong>${m.p1.name}</strong>
              </div>
              ${m.winner === 1 ? '<span>🏆 Ganador</span>' : `<button class="btn-sm btn-win" onclick="setWinner(${rNum},${idx}, 1)">Gana</button>`}
            </div>

            <!-- Competidor 2 -->
            <div class="competitor-row ${m.winner === 2 ? 'winner' : ''}">
              <div class="competitor-info">
                ${TEAM_ICONS[m.p2.team] || ''}
                <strong>${m.p2.name}</strong>
              </div>
              ${m.winner === 2 ? '<span>🏆 Ganador</span>' : `<button class="btn-sm btn-win" onclick="setWinner(${rNum},${idx}, 2)">Gana</button>`}
            </div>
          `;
          tournamentBracket.appendChild(matchCard);

          if (!m.winner) canAdvance = false;
        });
      });

      const lastRoundKey = Math.max(...Object.keys(tournamentData.rounds).map(Number));
      const lastRoundMatches = tournamentData.rounds[lastRoundKey];

      if (lastRoundMatches.length === 1 && lastRoundMatches[0].winner) {
        nextRoundBtn.style.display = 'none';
        const winnerObj = lastRoundMatches[0].winner === 1 ? lastRoundMatches[0].p1 : lastRoundMatches[0].p2;
        const banner = document.createElement('div');
        banner.style.textAlign = 'center';
        banner.style.padding = '15px';
        banner.style.backgroundColor = '#2e7d32';
        banner.style.borderRadius = '8px';
        banner.style.marginTop = '15px';
        banner.innerHTML = `<h3>🎉 ¡CAMPEÓN DEL TORNEO! 🎉</h3><p style="font-size: 1.2rem; margin-top:5px;">${winnerObj.name}</p>`;
        tournamentBracket.appendChild(banner);
      } else {
        nextRoundBtn.style.display = canAdvance ? 'block' : 'none';
      }
    }

    nextRoundBtn.addEventListener('click', () => {
      const currentRKey = Math.max(...Object.keys(tournamentData.rounds).map(Number));
      const currentMatches = tournamentData.rounds[currentRKey];

      const winners = currentMatches.map(m => m.winner === 1 ? m.p1 : m.p2);
      if (winners.length < 2) return;

      const nextMatches = [];
      for (let i = 0; i < winners.length; i += 2) {
        if (i + 1 < winners.length) {
          nextMatches.push({ p1: winners[i], p2: winners[i+1], winner: null });
        } else {
          nextMatches.push({ p1: winners[i], p2: { name: "Pasa Directo (Bye)", team: winners[i].team }, winner: 1 });
        }
      }

      tournamentData.rounds[currentRKey + 1] = nextMatches;
      saveTournament();
    });

    window.clearTournament = function() {
      if (confirm("¿Deseas reiniciar el torneo?")) {
        tournamentData = { currentRound: 1, rounds: {} };
        saveTournament();
      }
    };

    renderTournament();
  </script>
</body>
</html>
