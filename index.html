<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karate Dojo - Torneo y Entrenamiento</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #181818;
      --accent-color: #d32f2f;
      --text-color: #ffffff;
      --text-muted: #888888;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tabs {
      display: flex;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: white;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .tab-content.active {
      display: flex;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    .display-area {
      text-align: center;
      padding: 30px 10px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: rgba(0,0,0,0.2);
    }

    .number-display {
      font-size: 4rem;
      font-weight: bold;
      color: var(--accent-color);
      line-height: 1;
    }

    .technique-display {
      font-size: 1.5rem;
      margin-top: 10px;
      font-weight: 500;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      text-transform: uppercase;
    }

    .btn-primary { background-color: var(--accent-color); color: white; }
    .btn-secondary { background-color: #333; color: white; margin-top: 10px; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    label { font-size: 0.9rem; color: var(--text-muted); }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: white;
      font-size: 1rem;
    }

    textarea { resize: vertical; min-height: 90px; }

    .tech-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .tech-item-actions { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #0288d1; color: white; }
    .btn-delete { background-color: #d32f2f; color: white; }

    .form-row { display: flex; gap: 10px; }
    .form-row input:first-child { flex: 1; }
    .form-row input:last-child { flex: 2; }

    .teams-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .team-checkbox-card {
      background-color: #222;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .team-checkbox-card input { width: auto; }

    .bracket-scroll-container {
      width: 100%;
      overflow-x: auto;
      padding: 15px 5px;
      -webkit-overflow-scrolling: touch;
    }

    .tournament-tree-copa {
      display: flex;
      gap: 40px;
      align-items: center;
      min-width: max-content;
    }

    .round-column-copa {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 30px;
      min-width: 140px;
    }

    .round-title-copa {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--accent-color);
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .match-box-copa {
      background: #1e1e24;
      border: 1px solid #3d3d4e;
      border-radius: 16px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .competitor-btn-copa {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #121216;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      padding: 4px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .competitor-btn-copa.winner {
      background: #1b4721;
      border-color: #4caf50;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.4);
    }

    .team-img-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
      background-color: #222;
    }

    .competitor-name-text {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .champion-box-copa {
      background: linear-gradient(135deg, #d32f2f, #b71c1c);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      color: white;
      width: 140px;
      box-shadow: 0 0 15px rgba(211, 47, 47, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Karate Dojo</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('train')">Entrenamiento</button>
      <button class="tab-btn" onclick="switchTab('tournament')">Torneo / Llaves</button>
    </div>

    <!-- ENTRENAMIENTO -->
    <div id="trainTab" class="tab-content active">
      <div class="card">
        <div class="display-area">
          <div class="number-display" id="numDisplay">-</div>
          <div class="technique-display" id="techDisplay">Presiona Iniciar</div>
          <div class="status-text" id="statusText">Listo</div>
        </div>
        <button id="mainBtn" class="btn btn-primary">Iniciar Entrenamiento</button>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Configuración</h2>
        <div class="control-group">
          <label for="intervalMin">Intervalo Mínimo (seg):</label>
          <input type="number" id="intervalMin" value="2" min="1" max="10">
        </div>
        <div class="control-group">
          <label for="intervalMax">Intervalo Máximo (seg):</label>
          <input type="number" id="intervalMax" value="5" min="2" max="15">
        </div>
        <div class="control-group">
          <label for="voiceMode">Modo de Voz:</label>
          <select id="voiceMode">
            <option value="both">Número + Técnica</option>
            <option value="number">Solo Número</option>
            <option value="technique">Solo Técnica</option>
            <option value="silent">Silencioso</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Mapeo de Técnicas</h2>
        <div class="form-row" style="margin-bottom: 10px;">
          <input type="number" id="inputNum" placeholder="N°">
          <input type="text" id="inputTech" placeholder="Nombre de Técnica">
        </div>
        <button id="saveTechBtn" class="btn btn-secondary" style="margin-top: 0;">Guardar Técnica</button>
        <div id="techList" style="margin-top: 15px;"></div>
      </div>
    </div>

    <!-- TORNEO -->
    <div id="tournamentTab" class="tab-content">
      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Equipos Habilitados</h2>
        
        <div class="teams-select-grid">
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkLobo" checked>
            <span>Lobo 🐺</span>
          </label>
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkLeon" checked>
            <span>León 🦁</span>
          </label>
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkCalamar" checked>
            <span>Calamar 🦑</span>
          </label>
          <label class="team-checkbox-card">
            <input type="checkbox" id="chkAguila" checked>
            <span>Águila 🦅</span>
          </label>
        </div>

        <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Competidores</h2>
        <div class="control-group">
          <textarea id="competitorsInput" placeholder="Ingresa nombres (uno por línea):
Ñublense
Huachipato
Cobreloa
Magallanes
Unión Española
Antofagasta
U. Católica
U. de Chile"></textarea>
        </div>

        <button id="generateMatchesBtn" class="btn btn-primary">Crear Llave Copa</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h2 style="font-size: 1.2rem;">Cuadro del Torneo</h2>
          <button class="btn-sm btn-delete" onclick="clearTournament()" style="padding: 6px 12px;">Reiniciar</button>
        </div>

        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
          👉 Desliza hacia la derecha para ver todas las rondas. Haz clic en un competidor para marcarlo como ganador.
        </p>

        <div class="bracket-scroll-container">
          <div id="tournamentTree" class="tournament-tree-copa">
            <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; width: 100%;">Genera la llave para ver los enfrentamientos.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* NOMBRES DIRECTOS DE TUS ARCHIVOS EN GITHUB */
    const TEAM_IMAGES = {
      lobo: 'lobo.jpg',
      leon: 'leon.jpg',
      calamar: 'calamar.jpg',
      aguila: 'aguila.jpg'
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'train') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('trainTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tournamentTab').classList.add('active');
      }
    }

    let techniques = JSON.parse(localStorage.getItem('karate_techs')) || {
      1: "Oi Tsuki",
      2: "Gyaku Tsuki",
      3: "Age Uke",
      4: "Soto Uke",
      5: "Gedan Barai"
    };

    let isRunning = false;
    let timer = null;

    const mainBtn = document.getElementById('mainBtn');
    const numDisplay = document.getElementById('numDisplay');
    const techDisplay = document.getElementById('techDisplay');
    const statusText = document.getElementById('statusText');
    const saveTechBtn = document.getElementById('saveTechBtn');
    const techList = document.getElementById('techList');

    function saveToStorage() {
      localStorage.setItem('karate_techs', JSON.stringify(techniques));
      renderList();
    }

    function renderList() {
      techList.innerHTML = '';
      Object.keys(techniques).sort((a,b) => a-b).forEach(num => {
        const item = document.createElement('div');
        item.className = 'tech-item';
        item.innerHTML = `
          <span><strong>${num}:</strong> ${techniques[num]}</span>
          <div class="tech-item-actions">
            <button class="btn-sm btn-edit" onclick="editTech(${num})">Editar</button>
            <button class="btn-sm btn-delete" onclick="deleteTech(${num})">X</button>
          </div>
        `;
        techList.appendChild(item);
      });
    }

    saveTechBtn.addEventListener('click', () => {
      const num = document.getElementById('inputNum').value;
      const tech = document.getElementById('inputTech').value.trim();

      if (num && tech) {
        techniques[num] = tech;
        saveToStorage();
        document.getElementById('inputNum').value = '';
        document.getElementById('inputTech').value = '';
      }
    });

    window.deleteTech = function(num) {
      delete techniques[num];
      saveToStorage();
    };

    window.editTech = function(num) {
      document.getElementById('inputNum').value = num;
      document.getElementById('inputTech').value = techniques[num];
    };

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerNext() {
      const keys = Object.keys(techniques);
      if (keys.length === 0) return;

      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const techName = techniques[randomKey];

      numDisplay.textContent = randomKey;
      techDisplay.textContent = techName;

      const mode = document.getElementById('voiceMode').value;
      if (mode === 'both') speak(`${randomKey}, ${techName}`);
      else if (mode === 'number') speak(randomKey);
      else if (mode === 'technique') speak(techName);

      scheduleNext();
    }

    function scheduleNext() {
      if (!isRunning) return;
      const min = parseInt(document.getElementById('intervalMin').value) || 2;
      const max = parseInt(document.getElementById('intervalMax').value) || 5;
      const delay = (Math.floor(Math.random() * (max - min + 1)) + min) * 1000;

      timer = setTimeout(triggerNext, delay);
    }

    mainBtn.addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        clearTimeout(timer);
        mainBtn.textContent = 'Iniciar Entrenamiento';
        mainBtn.style.backgroundColor = 'var(--accent-color)';
        statusText.textContent = 'Pausado';
      } else {
        isRunning = true;
        mainBtn.textContent = 'Detener';
        mainBtn.style.backgroundColor = '#555';
        statusText.textContent = 'Entrenando...';
        triggerNext();
      }
    });

    renderList();

    let tournamentTreeData = JSON.parse(localStorage.getItem('karate_copa_v6')) || null;

    function getSelectedTeams() {
      const teams = [];
      if (document.getElementById('chkLobo').checked) teams.push('lobo');
      if (document.getElementById('chkLeon').checked) teams.push('leon');
      if (document.getElementById('chkCalamar').checked) teams.push('calamar');
      if (document.getElementById('chkAguila').checked) teams.push('aguila');
      return teams.length > 0 ? teams : ['lobo'];
    }

    document.getElementById('generateMatchesBtn').addEventListener('click', () => {
      const rawText = document.getElementById('competitorsInput').value.trim();
      if (!rawText) return alert("Ingresa competidores.");

      let list = rawText.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
      if (list.length < 2) return alert("Ingresa al menos 2 competidores.");

      const activeTeams = getSelectedTeams();

      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }

      const participants = list.map(name => ({
        name: name,
        team: activeTeams[Math.floor(Math.random() * activeTeams.length)]
      }));

      const rounds = {};
      let currentParticipants = participants;
      let roundNum = 1;

      while (currentParticipants.length > 1) {
        const matches = [];
        const nextParticipants = [];

        for (let i = 0; i < currentParticipants.length; i += 2) {
          if (i + 1 < currentParticipants.length) {
            matches.push({ p1: currentParticipants[i], p2: currentParticipants[i+1], winner: null });
            nextParticipants.push({ name: "?", team: "lobo", isPlaceholder: true });
          } else {
            matches.push({ p1: currentParticipants[i], p2: { name: "Bye", team: currentParticipants[i].team, isBye: true }, winner: 1 });
            nextParticipants.push(currentParticipants[i]);
          }
        }

        rounds[roundNum] = matches;
        currentParticipants = nextParticipants;
        roundNum++;
      }

      tournamentTreeData = { rounds: rounds };
      saveTreeStorage();
    });

    function selectTreeWinner(roundNum, matchIdx, winnerNum) {
      const currentMatch = tournamentTreeData.rounds[roundNum][matchIdx];
      currentMatch.winner = winnerNum;

      const winnerObj = winnerNum === 1 ? currentMatch.p1 : currentMatch.p2;
      const nextRoundNum = parseInt(roundNum) + 1;

      if (tournamentTreeData.rounds[nextRoundNum]) {
        const nextMatchIdx = Math.floor(matchIdx / 2);
        const isP1 = matchIdx % 2 === 0;

        if (isP1) {
          tournamentTreeData.rounds[nextRoundNum][nextMatchIdx].p1 = winnerObj;
        } else {
          tournamentTreeData.rounds[nextRoundNum][nextMatchIdx].p2 = winnerObj;
        }
      }

      saveTreeStorage();
    }

    function saveTreeStorage() {
      localStorage.setItem('karate_copa_v6', JSON.stringify(tournamentTreeData));
      renderTree();
    }

    function renderTree() {
      const container = document.getElementById('tournamentTree');
      if (!tournamentTreeData || !tournamentTreeData.rounds) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; width: 100%;">Genera la llave para ver los enfrentamientos.</p>`;
        return;
      }

      container.innerHTML = '';
      const roundKeys = Object.keys(tournamentTreeData.rounds).map(Number).sort((a,b) => a-b);

      roundKeys.forEach(rNum => {
        const col = document.createElement('div');
        col.className = 'round-column-copa';

        let rName = `Ronda ${rNum}`;
        if (rNum === roundKeys.length) rName = "Final";
        else if (rNum === roundKeys.length - 1) rName = "Semifinal";

        col.innerHTML = `<div class="round-title-copa">${rName}</div>`;

        tournamentTreeData.rounds[rNum].forEach((m, idx) => {
          const matchBox = document.createElement('div');
          matchBox.className = 'match-box-copa';

          const imgP1 = TEAM_IMAGES[m.p1.team] || TEAM_IMAGES['lobo'];
          const imgP2 = TEAM_IMAGES[m.p2.team] || TEAM_IMAGES['lobo'];

          matchBox.innerHTML = `
            <div class="competitor-btn-copa ${m.winner === 1 ? 'winner' : ''}" onclick="selectTreeWinner(${rNum}, ${idx}, 1)">
              <img src="${imgP1}" class="team-img-badge" alt="logo">
              <span class="competitor-name-text">${m.p1.name}</span>
            </div>

            <div class="competitor-btn-copa ${m.winner === 2 ? 'winner' : ''}" onclick="selectTreeWinner(${rNum}, ${idx}, 2)">
              <img src="${imgP2}" class="team-img-badge" alt="logo">
              <span class="competitor-name-text">${m.p2.name}</span>
            </div>
          `;
          col.appendChild(matchBox);
        });

        container.appendChild(col);
      });

      const finalRound = tournamentTreeData.rounds[roundKeys.length];
      if (finalRound && finalRound[0] && finalRound[0].winner) {
        const winnerObj = finalRound[0].winner === 1 ? finalRound[0].p1 : finalRound[0].p2;
        const champImg = TEAM_IMAGES[winnerObj.team] || TEAM_IMAGES['lobo'];

        const champCol = document.createElement('div');
        champCol.className = 'round-column-copa';
        champCol.innerHTML = `
          <div class="round-title-copa">Campeón</div>
          <div class="champion-box-copa">
            <div style="margin-bottom: 5px; display: flex; justify-content: center;">
              <img src="${champImg}" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid white; object-fit: cover;" alt="campeon">
            </div>
            <div style="font-weight: bold; font-size: 0.95rem;">${winnerObj.name}</div>
            <div style="font-size: 0.7rem; margin-top: 4px; opacity: 0.8;">🏆 GANADOR</div>
          </div>
        `;
        container.appendChild(champCol);
      }
    }

    window.clearTournament = function() {
      if (confirm("¿Deseas reiniciar el torneo?")) {
        tournamentTreeData = null;
        saveTreeStorage();
      }
    };

    renderTree();
  </script>
</body>
</html>
